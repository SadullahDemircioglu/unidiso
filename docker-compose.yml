# Dokploy: "Compose" servisi olarak ekleyin. Ortam değişkenlerini Dokploy'daki
# Environment bölümüne girin (api/.env.example'daki anahtarlar).
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
  api:
    build: ./api
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO:-info@unidiso.com}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    expose:
      - "3000"
