server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .html uzantısını URL'den kaldır (eski bağlantılar 301 ile yönlenir)
    absolute_redirect off;
    if ($request_uri ~ ^(.*)/index\.html(\?.*)?$) { return 301 $1/$2; }
    if ($request_uri ~ ^([^?]+)\.html(\?.*)?$) { return 301 $1$2; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/html;

    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Demo formu API'si (docker-compose'daki "api" servisi)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
